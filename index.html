<!DOCTYPE html>
<html lang="en" data-theme="cupcake">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD | Job Tracker</title>

    <!-- Added google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- added daisy ui and tailwind Css -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- addeing daisy ui all themes -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <!-- added font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body>
    <header class="max-w-5xl mx-auto mt-10">
        <h1 class="text-[#002C5C] text-2xl font-bold mb-3">Job Application Tracker</h1>
        <div class="flex flex-col sm:flex-row justify-between gap-4">
            <!-- total applcations -->
            <div class="bg-white p-3 rounded-lg w-[360px]">
                <p>Total</p>
                <p id="total-applications" class="font-bold text-xl">8</p>
            </div>

            <!-- total interviews -->
            <div class="bg-white p-3 rounded-lg w-[360px]">
                <p>Interview</p>
                <p id="total-interviews" class="font-bold text-xl text-green-400">0</p>
            </div>

            <!-- total rejecteds -->
            <div class="bg-white p-3 rounded-lg w-[360px]">
                <p>Rejected</p>
                <p id="total-rejecteds" class="font-bold text-xl text-red-500">0</p>
            </div>
        </div>
    </header>

    <main>

    </main>
</body>

</html>
